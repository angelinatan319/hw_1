<!DOCTYPE html>
<html>
<head><title>New Course</title></head>
<body>
  <h1>Create a Course</h1>
  <form method="post" action="/app/createCourse">
    <label>Course name: <input type="text" name="course-name" required></label><br>
    <label>Start time: <input type="time" name="start-time" required></label><br>
    <label>End time: <input type="time" name="end-time" required></label><br>

    <p>Days:</p>
    <label><input type="checkbox" name="day-mon"> Mon</label>
    <label><input type="checkbox" name="day-tue"> Tue</label>
    <label><input type="checkbox" name="day-wed"> Wed</label>
    <label><input type="checkbox" name="day-thu"> Thu</label>
    <label><input type="checkbox" name="day-fri"> Fri</label><br>

    <button type="submit">Create Course</button>
  </form>
</body>
</html>
